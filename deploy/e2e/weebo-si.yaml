# What weebo-si's release finds around it, for the importer's e2e: the
# bucket `angos` on the RustFS of secure.yaml, a Valkey for the cache, the
# chart's ServiceAccount `angos` (kept in gitops). The credentials Secret
# the importer's ExternalSecret would write is made by run.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: weebo-si
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-bucket-angos
  namespace: team-a
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      securityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: { type: RuntimeDefault } }
      volumes: [{ name: tmp, emptyDir: {} }]
      containers:
        - name: aws
          image: docker.io/amazon/aws-cli:2.38.1
          env:
            - { name: AWS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: rustfs, key: access-key-id } } }
            - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: rustfs, key: secret-key } } }
            - { name: AWS_DEFAULT_REGION, value: us-east-1 }
            - { name: HOME, value: /tmp }
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          args: [--endpoint-url, http://rustfs:9000, s3api, create-bucket, --bucket, angos]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: weebo-si
spec:
  selector: { matchLabels: { app: valkey } }
  template:
    metadata: { labels: { app: valkey } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:8.1.4-alpine
          ports: [{ containerPort: 6379 }]
          readinessProbe: { tcpSocket: { port: 6379 } }
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: weebo-si
spec:
  selector: { app: valkey }
  ports: [{ port: 6379 }]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: angos
  namespace: weebo-si
