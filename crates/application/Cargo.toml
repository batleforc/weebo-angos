[package]
name = "application"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
domain = { workspace = true }
api = { workspace = true }
weebo-kit-application = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
kube = { workspace = true }
tokio = { workspace = true }
weebo-kit-application = { workspace = true, features = ["test-support"] }

[features]
# Exposes `test_support` (the kit's in-memory owned objects and pod logs)
# to other crates' tests.
test-support = ["weebo-kit-application/test-support"]
